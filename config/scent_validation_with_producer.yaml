# SCENT validation configuration.
# This consumes the per-chromosome SCENT files generated by scripts/run_scent_chr_sweep.R.

scent_validation:
  scent_sweep_dir: results/pbmc/scent_chr_sweep_100kb_frac020_1000cells
  output_dir: results/pbmc/scent_validation

  methods:
    - linkpeaks
    - coactivity
    - coactivity_tf
    - full_moddist_lambda_0_1
    - full_lambda_0_1
    - distance_only

  top_n_values: [50, 100, 200]
  top_k_compare: 200

  reciprocal_overlap: 0.50

  # Support rule used after reading all SCENT-tested pairs.
  # pvalue_positive: beta > 0 and boot_basic_p/p <= threshold.
  # positive_score: score > scent_min_score.
  # all: every SCENT-tested overlapping pair counts as support.
  scent_support_rule: pvalue_positive
  scent_p_threshold: 0.05
  scent_min_score: 0.0

  distal_threshold: 50000
  distance_d0: 50000

  restrict_to_scent_chrs: true
  write_standardized_links: false
