# SCENT producer configuration.
# This generates the per-chromosome SCENT files consumed by config/scent_validation.yaml.
#
# Start with chr1 as a smoke test. For the full PBMC sweep, change chromosomes to:
#   [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12,
#    chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22]
# or use: auto

scent_run:
  output_dir: results/pbmc/scent_chr_sweep_100kb_frac020_1000cells

  chromosomes:
    - chr1

  # Candidate generation: gene TSS +/- link_distance using accessible peaks.
  link_distance: 100000

  # Minimum fraction of cells with nonzero RNA/ATAC count.
  min_pair_frac: 0.02

  # Keep this at 1000 initially; set <=0 to use all cells.
  max_cells: 1000

  # Guardrail. If a chromosome exceeds this, reduce window, increase min_pair_frac,
  # or split the chromosome further.
  max_scent_candidates: 100000

  # Passed directly to SCENT_algorithm().
  scent_cores: 4
  scent_regr: poisson

  # Leave blank to use synthetic all_cells.
  scoring_celltype: ""

  skip_existing: true
