# -----------------------------------------------------------------------------
# CAVEATS attached to this dataset, in this pipeline
# -----------------------------------------------------------------------------
#
# 1. NOT the Signac vignette dataset. The Signac "Joint RNA and ATAC analysis:
#    10x multiomic" vignette uses pbmc_granulocyte_sorted_10k from
#    cell-arc/1.0.0. Local filenames are identical once the sample prefix is
#    dropped, so the two are easy to confuse. Fragment-file sizes differ:
#    2,917,757,251 B (this dataset) vs 2,051,027,831 B (sorted).
#
# 2. NO CELL-LEVEL QC. run_linkpeaks_reranker.R:380 calls CreateSeuratObject()
#    without min.cells or min.features, and there is no subset() step. All
#    barcodes in the filtered matrix are used. Comparable Signac workflows
#    filter on nCount_ATAC, nCount_RNA, nucleosome_signal and TSS.enrichment
#    first.
#
# 3. ANNOTATION MISMATCH. Counts come from the Cell Ranger ARC GRCh38-2020-A
#    reference. TSS coordinates that drive distance_bp and distance_score come
#    from EnsDb.Hsapiens.v86 (Ensembl 86, 2016). Coordinates are compatible;
#    gene models are not identical. Genes absent from Ensembl 86 are dropped
#    silently, and TSS positions may differ for genes present in both. Distance
#    is the central confound in this benchmark, so this matters. Confirm the
#    exact GENCODE/Ensembl correspondence of 2020-A from 10x's reference build
#    notes before citing it.
#
# 4. PEAK COVERAGE. Of 111,857 called peaks, 50,918 (45.5%) are recoverable from
#    the committed results, after the min_pair_frac accessibility filter and
#    candidate restriction.
